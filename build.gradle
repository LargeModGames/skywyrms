plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = "${project.mod_version}-fabric-${project.minecraft_version}"

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
	def modVersion = project.mod_version
	inputs.property "version", modVersion

	filesMatching("fabric.mod.json") {
		expand "version": modVersion
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(Jar).configureEach {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}

jar {
	def projectName = project.name
	def modVersion = project.mod_version
	inputs.property "modVersion", modVersion

	manifest {
		attributes(
			"Specification-Title": projectName,
			"Specification-Vendor": "pokato",
			"Specification-Version": "1",
			"Implementation-Title": "Skywyrms",
			"Implementation-Version": modVersion,
			"Implementation-Vendor": "pokato"
		)
	}
}

test {
	useJUnitPlatform()
}
